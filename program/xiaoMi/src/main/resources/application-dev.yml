server:
  port: 9999

redis:
  sdk:
    config:
      host: localhost
      port: 6379
      pool-size: 10
      min-idle-size: 1
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

# ===== MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:13306/xiaomi?serverTimezone=GMT%2B8&useSSL=false
    username: root
    password: ptq123456
    driver-class-name: com.mysql.cj.jdbc.Driver


rocketmq:
    name-server: localhost:9876
    producer:
      group: my-producer-group  # 生产者组
      send-message-timeout: 10000
    consumer:
      group: my-consumer-group  # 消费者组

# MyBatis
mybatis:
  # 指定 MyBatis 的全局配置文件位置（可选）
  # config-location: classpath:mybatis/mybatis-config.xml

  # 指定 Mapper XML 文件的位置
  mapper-locations: classpath:/mapper/*.xml
  # 配置类型别名包路径
  type-aliases-package: com.example.xiaomi.dao
